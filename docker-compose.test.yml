# Docker Compose configuration for running tests locally
# Mirrors CI environment for consistent results

services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    init: true
    cap_add:
      - SYS_ADMIN
    volumes:
      # Mount snapshot directories for baseline generation
      # Playwright creates per-test-file snapshot directories
      - ./tests:/app/tests
      # Mount test-results for reports
      - ./test-results:/app/test-results
    network_mode: host
